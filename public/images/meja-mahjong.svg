<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Meja mahjong">
    <defs>
        <radialGradient id="felt" cx="50%" cy="45%" r="72%">
            <stop offset="0%" stop-color="#1f8a5b"/>
            <stop offset="55%" stop-color="#146b45"/>
            <stop offset="100%" stop-color="#0a3f29"/>
        </radialGradient>
        <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffdf6"/>
            <stop offset="100%" stop-color="#e7dfc7"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
            <stop offset="60%" stop-color="#042417" stop-opacity="0"/>
            <stop offset="100%" stop-color="#042417" stop-opacity="0.45"/>
        </radialGradient>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
        </pattern>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#042417" flood-opacity="0.45"/>
        </filter>
        <symbol id="tileV" viewBox="0 0 22 32">
            <rect width="22" height="32" rx="4" fill="url(#ivory)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="3" y="3" width="16" height="26" rx="2.5" fill="none" stroke="#ded5bd" stroke-width="1"/>
        </symbol>
        <symbol id="tileH" viewBox="0 0 32 22">
            <rect width="32" height="22" rx="4" fill="url(#ivory)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="3" y="3" width="26" height="16" rx="2.5" fill="none" stroke="#ded5bd" stroke-width="1"/>
        </symbol>
    </defs>

    <rect width="800" height="600" fill="url(#felt)"/>
    <rect width="800" height="600" fill="url(#dots)"/>
    <rect x="34" y="22" width="732" height="556" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
    <rect x="48" y="36" width="704" height="528" rx="20" fill="none" stroke="#042a1b" stroke-opacity="0.28" stroke-width="2"/>
    <rect width="800" height="600" fill="url(#sheen)"/>

    <g filter="url(#soft)">
