<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Meja mahjong elegan">
    <defs>
        <radialGradient id="felt" cx="50%" cy="40%" r="78%">
            <stop offset="0%" stop-color="#2aa06a"/>
            <stop offset="42%" stop-color="#17714a"/>
            <stop offset="78%" stop-color="#0d4a30"/>
            <stop offset="100%" stop-color="#062c1d"/>
        </radialGradient>
        <radialGradient id="spotlight" cx="50%" cy="44%" r="42%">
            <stop offset="0%" stop-color="#7ff0b6" stop-opacity="0.22"/>
            <stop offset="55%" stop-color="#7ff0b6" stop-opacity="0.06"/>
            <stop offset="100%" stop-color="#7ff0b6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffef9"/>
            <stop offset="55%" stop-color="#f6efdd"/>
            <stop offset="100%" stop-color="#ddd2b3"/>
        </linearGradient>
        <linearGradient id="tileSide" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#d8d0b8"/>
            <stop offset="100%" stop-color="#a89d7e"/>
        </linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f6e6a8"/>
            <stop offset="35%" stop-color="#d4af6a"/>
            <stop offset="70%" stop-color="#a97f3c"/>
            <stop offset="100%" stop-color="#e8cf94"/>
        </linearGradient>
        <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#7a5230"/>
            <stop offset="35%" stop-color="#5b3a1f"/>
            <stop offset="100%" stop-color="#33200f"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
            <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="vignette" cx="50%" cy="45%" r="74%">
            <stop offset="62%" stop-color="#02160e" stop-opacity="0"/>
            <stop offset="100%" stop-color="#02160e" stop-opacity="0.55"/>
        </radialGradient>
        <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="0.9" fill="#ffffff" opacity="0.05"/>
        </pattern>
        <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#03170e" flood-opacity="0.5"/>
        </filter>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="9" result="b"/>
            <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <symbol id="tileFaceV" viewBox="0 0 22 32">
            <rect x="1.6" y="1.6" width="18.8" height="28.8" rx="3.5" fill="url(#ivory)"/>
            <rect x="4" y="4" width="14" height="24" rx="2" fill="none" stroke="#e3dabd" stroke-width="0.9"/>
        </symbol>
        <symbol id="tileFaceH" viewBox="0 0 32 22">
            <rect x="1.6" y="1.6" width="28.8" height="18.8" rx="3.5" fill="url(#ivory)"/>
            <rect x="4" y="4" width="24" height="14" rx="2" fill="none" stroke="#e3dabd" stroke-width="0.9"/>
        </symbol>
    </defs>

    <!-- Felt background -->
    <rect width="800" height="600" fill="url(#felt)"/>
    <rect width="800" height="600" fill="url(#dots)"/>
    <rect width="800" height="600" fill="url(#spotlight)"/>

    <!-- Wooden rail -->
