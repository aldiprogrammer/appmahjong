    <!-- ubin yang sedang diambil, miring di udara -->
    <g filter="url(#soft2)" transform="translate(392 232) rotate(-8)">
        <rect width="52" height="76" rx="9" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
        <text x="26" y="56" font-size="42" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#c0392b" text-anchor="middle">中</text>
    </g>
    <g stroke="#a7f3d0" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="1 12" opacity="0.9">
        <path d="M420 208 q40 -46 96 -60"/>
    </g>

    <!-- kipas 13 ubin di tangan pemain -->
    <g filter="url(#soft2)">
        <!-- tiles fanned -->
        <g>
            <g transform="rotate(-32 300 560)"><rect x="212" y="248" width="58" height="84" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="241" y="308" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#c0392b" text-anchor="middle">中</text></g>
            <g transform="rotate(-24 300 560)"><rect x="248" y="240" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><circle cx="277" cy="268" r="5.5" fill="#157a4f"/><circle cx="277" cy="288" r="5.5" fill="#157a4f"/><circle cx="277" cy="308" r="5.5" fill="#157a4f"/></g>
