            <g transform="rotate(-8 300 560)"><rect x="328" y="234" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="357" y="294" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#c0392b" text-anchor="middle">萬</text></g>
            <g transform="rotate(0 300 560)"><rect x="368" y="232" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="397" y="292" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#157a4f" text-anchor="middle">發</text></g>
            <g transform="rotate(8 300 560)"><rect x="408" y="234" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><circle cx="437" cy="266" r="5.5" fill="#c0392b"/><circle cx="437" cy="286" r="5.5" fill="#c0392b"/><circle cx="437" cy="306" r="5.5" fill="#c0392b"/></g>
            <g transform="rotate(16 300 560)"><rect x="448" y="236" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="477" y="296" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#2c6fa8" text-anchor="middle">北</text></g>
            <g transform="rotate(24 300 560)"><rect x="488" y="240" width="58" height="86" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="517" y="300" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#c0392b" text-anchor="middle">萬</text></g>
            <g transform="rotate(32 300 560)"><rect x="528" y="248" width="58" height="84" rx="9" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="2"/><text x="557" y="308" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#157a4f" text-anchor="middle">發</text></g>
        </g>

        <!-- tangan (buku jari) -->
        <g fill="url(#skin)" stroke="#d18f5f" stroke-width="2">
            <path d="M250 340 q50 -36 104 -30 q44 6 74 26 q18 12 6 26 q-12 14 -34 8 l-64 -12 q-46 -6 -86 -18 Z"/>
            <ellipse cx="286" cy="352" rx="42" ry="26" transform="rotate(-14 286 352)"/>
        </g>
        <g fill="#e8a97a" opacity="0.4">
            <ellipse cx="316" cy="330" rx="4" ry="7" transform="rotate(-16 316 330)"/>
            <ellipse cx="344" cy="326" rx="4" ry="7" transform="rotate(-8 344 326)"/>
            <ellipse cx="372" cy="324" rx="4" ry="7"/>
        </g>
    </g>

    <!-- ubin buangan di meja -->
    <g filter="url(#soft2)">
        <g transform="translate(96 430) rotate(-10)">
            <rect width="50" height="72" rx="8" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
            <text x="25" y="52" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#2c6fa8" text-anchor="middle">西</text>
        </g>
        <g transform="translate(610 452) rotate(12)">
            <rect width="50" height="72" rx="8" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
            <circle cx="17" cy="22" r="5" fill="#c0392b"/><circle cx="33" cy="22" r="5" fill="#c0392b"/>
            <circle cx="25" cy="36" r="5" fill="#c0392b"/>
            <circle cx="17" cy="50" r="5" fill="#c0392b"/><circle cx="33" cy="50" r="5" fill="#c0392b"/>
        </g>
        <g transform="translate(690 436) rotate(-6)">
            <rect width="50" height="72" rx="8" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
            <text x="25" y="52" font-size="34" font-family="Georgia, serif" font-weight="700" fill="#c0392b" text-anchor="middle">萬</text>
        </g>
    </g>

    <rect width="800" height="560" fill="url(#vignette2)"/>
</svg>
