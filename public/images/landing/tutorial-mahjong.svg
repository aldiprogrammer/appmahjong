            <rect x="260" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="300" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="340" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="380" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="420" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="460" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="500" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="540" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="580" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="620" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
