<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Ilustrasi tutorial belajar mahjong">
    <defs>
        <radialGradient id="felt2" cx="50%" cy="42%" r="75%">
            <stop offset="0%" stop-color="#22955f"/>
            <stop offset="55%" stop-color="#146b45"/>
            <stop offset="100%" stop-color="#0a3f29"/>
        </radialGradient>
        <linearGradient id="ivory2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffdf6"/>
            <stop offset="100%" stop-color="#e7dfc7"/>
        </linearGradient>
        <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f7c99b"/>
            <stop offset="100%" stop-color="#e8a97a"/>
        </linearGradient>
        <pattern id="dots2" width="16" height="16" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.07"/>
        </pattern>
        <radialGradient id="vignette2" cx="50%" cy="42%" r="75%">
            <stop offset="60%" stop-color="#042417" stop-opacity="0"/>
            <stop offset="100%" stop-color="#042417" stop-opacity="0.45"/>
        </radialGradient>
        <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#042417" flood-opacity="0.45"/>
        </filter>
    </defs>

    <rect width="800" height="560" fill="url(#felt2)"/>
    <rect width="800" height="560" fill="url(#dots2)"/>

    <!-- tumpukan ubin (dinding) di belakang -->
    <g filter="url(#soft2)">
        <g>
            <rect x="60" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="100" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="140" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="180" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="220" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="260" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="300" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="340" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="380" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
