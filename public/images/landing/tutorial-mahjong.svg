            <rect x="660" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="700" y="96" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
        </g>
        <g>
