            <rect x="100" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="140" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="180" y="152" width="34" height="50" rx="5" fill="url(#ivory2)" stroke="#c9c0a6" stroke-width="1"/>
