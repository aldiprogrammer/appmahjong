        <text x="1045" y="222" font-size="26">萬</text>
        <text x="445" y="692" font-size="26">發</text>
        <text x="565" y="692" font-size="26">中</text>
        <text x="685" y="692" font-size="26">發</text>
        <text x="805" y="692" font-size="26">中</text>
        <text x="925" y="692" font-size="26">發</text>
        <text x="1045" y="692" font-size="26">中</text>
    </g>
    <g fill="#2c6fa8" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
        <text x="362" y="304" font-size="21">東</text>
        <text x="362" y="380" font-size="21">南</text>
        <text x="362" y="456" font-size="21">西</text>
        <text x="362" y="532" font-size="21">北</text>
