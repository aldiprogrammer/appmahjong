        <text x="745" y="222" font-size="26">發</text>
        <text x="985" y="222" font-size="26">發</text>
        <text x="505" y="692" font-size="26">萬</text>
        <text x="745" y="692" font-size="26">萬</text>
        <text x="985" y="692" font-size="26">萬</text>
    </g>

    <!-- ubin muka terbuka di tengah -->
    <g filter="url(#soft)">
        <g transform="translate(700 340) rotate(-10)">
            <rect width="80" height="80" rx="14" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
            <circle cx="25" cy="25" r="7" fill="#c0392b"/>
            <circle cx="55" cy="25" r="7" fill="#c0392b"/>
            <circle cx="40" cy="40" r="7" fill="#c0392b"/>
            <circle cx="25" cy="55" r="7" fill="#c0392b"/>
            <circle cx="55" cy="55" r="7" fill="#c0392b"/>
        </g>
        <g transform="translate(810 380) rotate(14)">
            <rect width="80" height="80" rx="14" fill="#fffdf6" stroke="#c9c0a6" stroke-width="2"/>
            <text x="40" y="56" font-size="44" font-family="Georgia, 'Times New Roman', serif" font-weight="700" fill="#157a4f" text-anchor="middle">發</text>
        </g>
    </g>

    <!-- cangkir teh -->
    <g filter="url(#soft)">
        <g transform="translate(1330 720)">
            <ellipse cx="0" cy="34" rx="42" ry="10" fill="#042417" opacity="0.28"/>
            <path d="M-32 0 h64 l-8 30 a16 16 0 0 1 -16 12 h-16 a16 16 0 0 1 -16 -12 Z" fill="#fef3c7"/>
            <path d="M32 8 q22 4 0 20" fill="none" stroke="#fef3c7" stroke-width="8" stroke-linecap="round"/>
            <ellipse cx="0" cy="0" rx="32" ry="7" fill="#157a4f"/>
        </g>
        <g transform="translate(230 740)">
            <ellipse cx="0" cy="30" rx="38" ry="9" fill="#042417" opacity="0.28"/>
            <path d="M-28 0 h56 l-7 26 a15 15 0 0 1 -15 11 h-12 a15 15 0 0 1 -15 -11 Z" fill="#fef3c7"/>
            <path d="M28 7 q20 4 0 18" fill="none" stroke="#fef3c7" stroke-width="7" stroke-linecap="round"/>
            <ellipse cx="0" cy="0" rx="28" ry="6" fill="#157a4f"/>
        </g>
    </g>

    <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
