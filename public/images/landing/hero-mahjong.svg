<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ilustrasi meja mahjong">
    <defs>
        <radialGradient id="felt" cx="50%" cy="45%" r="75%">
            <stop offset="0%" stop-color="#1f8a5b"/>
            <stop offset="55%" stop-color="#146b45"/>
            <stop offset="100%" stop-color="#0a3f29"/>
        </radialGradient>
        <linearGradient id="ivory" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fffdf6"/>
            <stop offset="100%" stop-color="#e7dfc7"/>
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#d9f99d" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="#d9f99d" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
            <stop offset="60%" stop-color="#042417" stop-opacity="0"/>
            <stop offset="100%" stop-color="#042417" stop-opacity="0.5"/>
        </radialGradient>
        <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.06"/>
        </pattern>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#042417" flood-opacity="0.45"/>
        </filter>
        <symbol id="tileV" viewBox="0 0 22 32">
            <rect width="22" height="32" rx="4" fill="url(#ivory)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="3" y="3" width="16" height="26" rx="2.5" fill="none" stroke="#ded5bd" stroke-width="1"/>
        </symbol>
        <symbol id="tileH" viewBox="0 0 32 22">
            <rect width="32" height="22" rx="4" fill="url(#ivory)" stroke="#c9c0a6" stroke-width="1"/>
            <rect x="3" y="3" width="26" height="16" rx="2.5" fill="none" stroke="#ded5bd" stroke-width="1"/>
        </symbol>
    </defs>

    <rect width="1600" height="900" fill="url(#felt)"/>
    <rect width="1600" height="900" fill="url(#dots)"/>

    <!-- lampu hangat -->
    <circle cx="430" cy="90" r="260" fill="url(#glow)"/>
    <circle cx="1170" cy="80" r="240" fill="url(#glow)"/>
    <g stroke="#042417" stroke-opacity="0.35" stroke-width="6">
        <line x1="430" y1="0" x2="430" y2="120"/>
        <line x1="1170" y1="0" x2="1170" y2="110"/>
    </g>
    <g filter="url(#soft)">
        <path d="M394 120 q36 -46 72 0 q-14 34 -36 34 q-22 0 -36 -34Z" fill="#157a4f" stroke="#0d5b3a" stroke-width="3"/>
        <path d="M1134 110 q36 -46 72 0 q-14 34 -36 34 q-22 0 -36 -34Z" fill="#157a4f" stroke="#0d5b3a" stroke-width="3"/>
        <circle cx="430" cy="158" r="8" fill="#fef3c7"/>
        <circle cx="1170" cy="148" r="8" fill="#fef3c7"/>
    </g>

    <!-- bingkai meja -->
    <rect x="60" y="40" width="1480" height="820" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="3"/>
    <rect x="84" y="62" width="1432" height="776" rx="26" fill="none" stroke="#042a1b" stroke-opacity="0.28" stroke-width="3"/>
    <rect width="1600" height="900" fill="url(#sheen)"/>

    <!-- dinding ubin atas -->
    <g filter="url(#soft)">
        <g>
            <use href="#tileV" x="430" y="190" width="30" height="44"/>
            <use href="#tileV" x="470" y="190" width="30" height="44"/>
            <use href="#tileV" x="510" y="190" width="30" height="44"/>
