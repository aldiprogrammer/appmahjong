            <use href="#tileV" x="1070" y="190" width="30" height="44"/>
            <use href="#tileV" x="1110" y="190" width="30" height="44"/>
        </g>
        <!-- dinding ubin bawah -->
        <g>
            <use href="#tileV" x="430" y="660" width="30" height="44"/>
            <use href="#tileV" x="470" y="660" width="30" height="44"/>
            <use href="#tileV" x="510" y="660" width="30" height="44"/>
            <use href="#tileV" x="550" y="660" width="30" height="44"/>
            <use href="#tileV" x="590" y="660" width="30" height="44"/>
            <use href="#tileV" x="630" y="660" width="30" height="44"/>
            <use href="#tileV" x="670" y="660" width="30" height="44"/>
            <use href="#tileV" x="710" y="660" width="30" height="44"/>
            <use href="#tileV" x="750" y="660" width="30" height="44"/>
            <use href="#tileV" x="790" y="660" width="30" height="44"/>
            <use href="#tileV" x="830" y="660" width="30" height="44"/>
            <use href="#tileV" x="870" y="660" width="30" height="44"/>
            <use href="#tileV" x="910" y="660" width="30" height="44"/>
            <use href="#tileV" x="950" y="660" width="30" height="44"/>
            <use href="#tileV" x="990" y="660" width="30" height="44"/>
            <use href="#tileV" x="1030" y="660" width="30" height="44"/>
            <use href="#tileV" x="1070" y="660" width="30" height="44"/>
            <use href="#tileV" x="1110" y="660" width="30" height="44"/>
        </g>
        <!-- dinding ubin kiri & kanan -->
        <g>
            <use href="#tileH" x="340" y="280" width="44" height="30"/>
            <use href="#tileH" x="340" y="318" width="44" height="30"/>
            <use href="#tileH" x="340" y="356" width="44" height="30"/>
            <use href="#tileH" x="340" y="394" width="44" height="30"/>
            <use href="#tileH" x="340" y="432" width="44" height="30"/>
            <use href="#tileH" x="340" y="470" width="44" height="30"/>
